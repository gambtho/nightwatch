name: tomtectl

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tomtectl-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tomtectl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tomtectl/go.mod
          cache-dependency-path: tomtectl/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The suite is self-contained (fake clients; no kind cluster or
      # Docker service is involved).
      - name: go test
        run: go test ./...
