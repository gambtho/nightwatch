# The e2e agent: thinks with the in-cluster stub endpoint. A keyed
# plain-http URL is only legal because the host is spelled in the
# cluster-local .svc form (a bare service name would be rejected — a
# resolver search domain could send it anywhere).
apiVersion: tomte.dev/v1alpha1
kind: Agent
metadata:
  name: hello
spec:
  steps:
    - id: greet
      text: Say hello to the cluster.
  schedule:
    every: 10s
  llm:
    kind: openai_compatible
    base_url: http://llm-stub.tomte-e2e.svc:8080/v1
    model: stub-model
    secretRef: hello-key
  connectors: []
