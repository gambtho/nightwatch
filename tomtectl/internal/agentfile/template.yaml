# An agent, as code. This file IS the agent: reading it shows the
# topology — what the agent does, when it runs, what model it thinks
# with, and what it may reach. Deploy it with `tomtectl up`.
apiVersion: tomte.dev/v1alpha1
kind: Agent
metadata:
  name: hello
spec:
  # What the agent does, in order, each time it wakes. In K1 a
  # placeholder runtime prints each step verbatim; K2 hands the same
  # steps to an LLM. The shape does not change.
  steps:
    - id: greet
      text: Hello, world — from the hello agent.
  # When it runs. The agent stays resident and wakes on this interval —
  # a whole number with one unit: 30s, 5m, 2h.
  schedule:
    every: 30s
  # The model this agent thinks with. Empty means no LLM: the agent is
  # deterministic and prints its steps. To think, fill it in and store
  # the key with `tomtectl set-key`:
  #   llm:
  #     kind: anthropic              # anthropic | openai_compatible
  #     base_url: https://api.anthropic.com
  #     model: claude-haiku-4-5
  #     secretRef: hello-key         # K8s Secret holding the API key
  # A keyless local endpoint instead carries `local: true` and no
  # secretRef — a loopback URL alone never implies local.
  llm: {}
  # K3 — what the agent may reach. Tomte connectors and their permits
  # mount here; until then the agent has no reach beyond its own logs.
  connectors: []
